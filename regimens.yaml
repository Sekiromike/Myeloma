# ════════════════════════════════════════════════════════════════════
#  US Multiple Myeloma regimen catalogue — evidence as of October 2026
# ════════════════════════════════════════════════════════════════════
#  Efficacy
#    pfs_median     median PFS (months) from the pivotal / latest analysis
#    pfs_landmark   {month, survival} used when the median is not reached;
#                   the Weibull scale is solved so that S(month) = survival
#  Dates
#    approval_date  FDA approval of the indication (or label milestone)
#    uptake_start   when US use began, if earlier/later than approval
#                   (e.g. NCCN listing ahead of label, off-label use)
#    withdrawn      date the US indication was withdrawn
#  Adoption (relative attractiveness, normalised within a segment)
#    peak_share, speed (1/yr), inflection_years after uptake_start
#    decline_start / decline_speed / floor — displacement by successors
#  Adoption parameters are ANALYST CALIBRATIONS to approximate published US
#  real-world treatment patterns; replace with claims/EMR data when available.
# ════════════════════════════════════════════════════════════════════

defaults:
  weibull_shape: 1.3   # PFS hazard rising mildly with time (typical 1.1–1.4)

class_order: [Anti-CD38, PI, IMiD, BCMA CAR-T, BCMA bispecific, GPRC5D bispecific,
              BCMA ADC, SLAMF7, XPO1, Chemotherapy, ASCT]

regimens:
  # ───────────────────────── 1L · Transplant-eligible ─────────────────────────
  - name: Legacy-ASCT
    label: "VAD/Td → ASCT (legacy)"
    line: 1L
    eligibility: TE
    approval_date: "1990-01-01"
    classes: [Chemotherapy, ASCT]
    pfs_median: 28.0
    trial: IFM 90
    citation: "Attal M et al. NEJM 1996;335:91-97"
    note: "Pre-novel-agent era induction; retained for the historical burn-in."
    adoption: {peak_share: 1.0, speed: 1.0, inflection_years: 0, decline_start: 2009.0, decline_speed: 1.2, floor: 0.0}

  - name: VRd-ASCT
    label: "VRd → ASCT → R maintenance"
    line: 1L
    eligibility: TE
    approval_date: "2008-06-20"
