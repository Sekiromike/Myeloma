    classes: [PI, IMiD, ASCT]
    pfs_median: 67.5
    trial: DETERMINATION
    citation: "Richardson PG et al. NEJM 2022;387:132-147"
    note: "Bortezomib 1L label 2008; VRd entered NCCN after Richardson et al., Blood 2010."
    adoption: {peak_share: 1.0, speed: 1.2, inflection_years: 2.0, decline_start: 2024.8, decline_speed: 1.1, floor: 0.12}

  - name: D-VRd-ASCT
